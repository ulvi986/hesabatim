[project]
name = "hesabatim-backend"
version = "0.1.0"
description = "Hesabatım: AI-powered inventory & sales backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.8",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    'ignore:Dialect sqlite.pysqlite does .not. support Decimal:sqlalchemy.exc.SAWarning',
]

[tool.uv]
package = false
